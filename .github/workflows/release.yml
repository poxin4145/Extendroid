name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name for the APK file name (e.g. 1.1.0)'
        required: false
        default: '1.1.0'
      prerelease:
        description: 'Mark the created release as a pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare signing key
        env:
          SECRET_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$SECRET_KEYSTORE" ]; then
            echo "Using the keystore from repository secrets."
            echo "$SECRET_KEYSTORE" | base64 -d > "$RUNNER_TEMP/extendroid-release.p12"
            STORE_PASSWORD="$SECRET_STORE_PASSWORD"
            KEY_ALIAS="${SECRET_KEY_ALIAS:-extendroid}"
            KEY_PASSWORD="${SECRET_KEY_PASSWORD:-$SECRET_STORE_PASSWORD}"
          else
            echo "Using the keystore committed under .github/signing/."
            cp .github/signing/extendroid-release.p12 "$RUNNER_TEMP/extendroid-release.p12"
            STORE_PASSWORD="$(cat .github/signing/password.txt)"
            KEY_ALIAS="extendroid"
            KEY_PASSWORD="$STORE_PASSWORD"
          fi
          {
            echo "EXTENDROID_KEYSTORE=$RUNNER_TEMP/extendroid-release.p12"
            echo "EXTENDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "EXTENDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "EXTENDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        id: apk
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          [ -n "$VERSION" ] || VERSION="1.1.0"
          SOURCE=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          TARGET="Extendroid-${VERSION}.apk"
          cp "$SOURCE" "$TARGET"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "path=$TARGET" >> "$GITHUB_OUTPUT"
          sha256sum "$TARGET" | tee "$TARGET.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Extendroid-${{ steps.apk.outputs.version }}
          path: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.path }}.sha256

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.apk.outputs.version) }}
          name: Extendroid ${{ steps.apk.outputs.version }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.path }}.sha256
          body: |
            ## Extendroid ${{ steps.apk.outputs.version }}

            可选中文界面 / Optional Chinese UI：安装后在「选项 → 语言」中切换语言，
            或跟随系统语言自动切换。

            ### 安装
            1. 下载下方 `Extendroid-${{ steps.apk.outputs.version }}.apk`。
            2. 允许「安装未知来源应用」后安装。
            3. 首次启动需要 Shizuku 已运行并授权，详见 README 的使用说明。

            > 从旧版本升级时如提示签名冲突，请先卸载旧版本（会清空应用内设置）。
